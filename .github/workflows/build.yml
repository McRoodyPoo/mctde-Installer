name: Build Windows installer (MSVC)

# Builds mctde-Installer.exe (the GUI) with real MSVC (x64, static CRT), mirroring build_gui.bat,
# on GitHub's Windows runners so release builds don't depend on a local Windows install. The exe is
# uploaded as a workflow artifact on every run.

on:
  push:
    paths:
      - 'src/**'
      - 'third_party/**'
      - 'gui.rc'
      - 'gui.manifest'
      - '*.ico'
      - '*.bmp'
      - '*.png'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build mctde-Installer.exe (x64, /MT)
        shell: cmd
        run: |
          if not exist build mkdir build
          rc /nologo /fo build\gui.res gui.rc || exit /b 1
          cl /nologo /std:c++17 /EHsc /MT /W3 /DUNICODE /D_UNICODE /I src /I third_party src\Gui.cpp src\Bhd5.cpp src\Bnd3.cpp src\C4110Header.cpp src\Detect.cpp src\Dcx.cpp src\DisplayConfig.cpp src\Download.cpp src\Extract.cpp src\ExePatch.cpp src\ExePatchTable.cpp src\Installer.cpp src\Release.cpp src\NameHash.cpp src\NamelistData.cpp src\Sha256.cpp src\Unpacker.cpp src\Update.cpp src\VanillaManifest.cpp third_party\miniz.c build\gui.res /Fe:build\mctde-Installer.exe /Fo"build\\" /link /SUBSYSTEM:WINDOWS /ENTRY:wWinMainCRTStartup /MANIFEST:NO || exit /b 1

      # Fresh Windows installs don't have the VC++ redistributable: no runtime DLL dependencies.
      - name: Check for runtime DLL dependencies
        shell: pwsh
        run: |
          $deps = dumpbin /nologo /dependents build\mctde-Installer.exe
          $deps
          $bad = $deps | Select-String -Pattern 'VCRUNTIME|MSVCP|api-ms-win-crt|ucrtbase'
          if ($bad) { throw "mctde-Installer.exe depends on the VC++ runtime: $($bad -join ', ')" }

      - uses: actions/upload-artifact@v4
        with:
          name: mctde-Installer-win64
          path: build/mctde-Installer.exe
          if-no-files-found: error
