# DXVK config for PTDE (read from the game's working directory).
# Most lines are commented out, so DXVK runs on its defaults.
# The mctde launcher's "Vulkan" tab edits this file for you; you can also
# uncomment one line at a time by hand when A/B testing stutter.

# Show an FPS + frametime graph in the corner (handy for comparing against native D3D9).
# dxvk.hud = fps,frametimes

# Force vsync on (1) or off (0) regardless of what the game/DSFix asks for.
# 2 = every frame is held for exactly 2 refreshes (locked 30 fps on a 60 Hz screen), so
# vsync paces the game instead of its own jittery limiter. Set to 1 if unlockFPS is ever on.
d3d9.presentInterval = 2

# Fewer queued frames = lower input latency, sometimes smoother pacing.
# d3d9.maxFrameLatency = 1
